name: Hello world workflow

#We're creating the pipeline

on: 
  push: 
    branches: 
      - main
  pull_request: 
    branches: 
      - main 
  
jobs: 
  hello: 
    runs-on: ubuntu-latest #github-hosted runner
    steps: 
      - uses: actions/checkout@v2
      - name: hello world
        run: echo "Hello world"
        shell: bash
  goodbye: 
    runs-on: ubuntu-latest
    steps: 
      - name: goodbye world
        run: echo "Goodbye World"
        shell: bash
